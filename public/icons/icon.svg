<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="fillArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Subtle grid lines -->
  <line x1="64" y1="160" x2="448" y2="160" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="64" y1="352" x2="448" y2="352" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Area fill under line -->
  <path d="M 80 360 L 150 330 L 220 350 L 290 270 L 360 220 L 432 150 L 432 400 L 80 400 Z" fill="url(#fillArea)" />
  
  <!-- Chart Line -->
  <path d="M 80 360 L 150 330 L 220 350 L 290 270 L 360 220 L 432 150" 
        fill="none" 
        stroke="url(#chartGlow)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Points -->
  <circle cx="150" cy="330" r="7" fill="#06b6d4" />
  <circle cx="220" cy="350" r="7" fill="#0ea5e9" />
  <circle cx="290" cy="270" r="7" fill="#10b981" />
  <circle cx="360" cy="220" r="7" fill="#10b981" />
  
  <!-- End glowing dot -->
  <circle cx="432" cy="150" r="14" fill="#34d399" />
  <circle cx="432" cy="150" r="7" fill="#ffffff" />
  
  <!-- EUR symbol badge top right -->
  <circle cx="420" cy="92" r="32" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="3" />
  <text x="420" y="102" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" fill="#34d399" text-anchor="middle">€</text>
</svg>
