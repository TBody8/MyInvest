# Configuración de Nginx para "Mis Inversiones | Trading 212"
# Ubicación en VPS: /etc/nginx/sites-available/inversiones.conf
# Enlazar con: ln -s /etc/nginx/sites-available/inversiones.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name tu-dominio.com; # o la IP de tu VPS

    # Redirigir todo HTTP a HTTPS (si usas Certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Caché para PWA Service Worker (debe revalidar siempre)
    location /sw.js {
        proxy_pass http://127.0.0.1:3000/sw.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Caché estática para iconos y assets de la PWA
    location /icons/ {
        proxy_pass http://127.0.0.1:3000/icons/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Compresión gzip para máxima velocidad en móvil
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
}
